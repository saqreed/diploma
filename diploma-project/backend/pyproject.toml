[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "diploma-auth-backend"
version = "0.1.0"
description = "Backend package for the three-factor authentication platform."
requires-python = ">=3.12,<3.14"
dependencies = [
    "asyncpg>=0.31.0,<0.32.0",
    "fastapi>=0.140.7,<0.141.0",
    "pydantic-settings>=2.15.0,<2.16.0",
    "sqlalchemy[asyncio]>=2.0.52,<2.1.0",
    "uvicorn[standard]>=0.51.0,<0.52.0",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.12.0,<2.13.0",
    "pytest>=9.1.1,<9.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]
testpaths = ["tests"]
