[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "diploma-antifraud-backend"
version = "0.1.0"
description = "Configurable antifraud rules and reimbursement demonstration."
requires-python = ">=3.12,<3.14"
dependencies = [
    "asyncpg>=0.31.0,<0.32.0",
    "fastapi==0.140.8",
    "starlette==1.3.1",
    "anyio==4.14.2",
    "pydantic-settings>=2.15.0,<2.16.0",
    "sqlalchemy[asyncio]>=2.0.52,<2.1.0",
    "uvicorn[standard]>=0.51.0,<0.52.0",
    "httpx2==2.12.0",
    "cryptography>=46,<47",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.12.0,<2.13.0",
    "pytest>=9.1.1,<9.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]
testpaths = ["tests"]
