# Preserve the existing Compose network and data volumes after moving Git paths.
name: diploma-project

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diploma}
      POSTGRES_USER: ${POSTGRES_USER:-diploma}
      # Set a unique local password in .env before starting Compose.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Database access stays within the Compose network; no host port is published.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ${COMPOSE_PROJECT_NAME:-diploma-project}-backend
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DIPLOMA_DATABASE_URL: postgresql+asyncpg://diploma_antifraud:${DIPLOMA_AF_PASSWORD:?Run scripts/prepare-local.ps1}@postgres:5432/${POSTGRES_DB:-diploma}
      DIPLOMA_DEMO_DATABASE_URL: postgresql+asyncpg://diploma_demo:${DIPLOMA_DEMO_PASSWORD:?Run scripts/prepare-local.ps1}@postgres:5432/${POSTGRES_DB:-diploma}
      DIPLOMA_DEMO_API_KEY: ${DIPLOMA_DEMO_API_KEY:?Run scripts/prepare-local.ps1}
      DIPLOMA_SOURCE_ENCRYPTION_KEY: ${DIPLOMA_SOURCE_ENCRYPTION_KEY:?Run scripts/prepare-local.ps1}
      DIPLOMA_SOURCE_HOSTS: postgres
      DIPLOMA_SOURCE_TABLES: demo.requests
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert response.status == 200 and json.load(response) == {'status': 'ok'}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bootstrap:
    profiles: [tools]
    image: ${COMPOSE_PROJECT_NAME:-diploma-project}-backend
    command: [python, -m, app.bootstrap]
    environment:
      DIPLOMA_ADMIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diploma}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-diploma}
      DIPLOMA_AF_PASSWORD: ${DIPLOMA_AF_PASSWORD:?Run scripts/prepare-local.ps1}
      DIPLOMA_DEMO_PASSWORD: ${DIPLOMA_DEMO_PASSWORD:?Run scripts/prepare-local.ps1}
      DIPLOMA_READER_PASSWORD: ${DIPLOMA_READER_PASSWORD:?Run scripts/prepare-local.ps1}
      DIPLOMA_SEED_PASSWORD: ${DIPLOMA_SEED_PASSWORD:?Run scripts/prepare-local.ps1}
      DIPLOMA_DEMO_API_KEY: ${DIPLOMA_DEMO_API_KEY:?Run scripts/prepare-local.ps1}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
